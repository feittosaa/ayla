[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.89"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
cc = "1"
pkg-config = "0.3"
tauri-build = { version = "2.5.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.0", features = [] }
tauri-plugin-log = "2"

reqwest = { version = "0.13.2", default-features = false, features = ["json", "stream", "rustls", "form"] }
futures-util = "0.3"
tokio = { version = "1", features = ["fs", "process", "sync", "io-util", "time", "macros"] }
rusqlite = { version = "0.43", features = ["bundled", "backup"] }
sha2 = "0.10"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
flate2 = "1"
tar = "0.4"
tokio-util = { version = "0.7", features = ["rt"] }
base64 = "0.22"
hound = "3.5"
# Segredos do login na nuvem (PKCE, state, nonce); já presente na árvore de dependências.
getrandom = "0.3"
# Texto de PDFs anexados (MIT, Rust puro).
pdf-extract = "0.12"
keyring = { version = "3.6.3", features = ["sync-secret-service", "crypto-rust", "vendored"] }
# Horário local dos lembretes e repetições (já presente na árvore do Tauri).
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Data em que a foto foi tirada (EXIF), para a Iris comparar fotos ao longo do tempo (BSD-2, Rust puro).
kamadak-exif = "0.6"

# Mesma versão usada pelo Tauri (wry): libera o microfone na janela da Ayla no Linux.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }

# Verificação SHA-256 de modelos (GBs) lenta sem otimização; só afeta builds de desenvolvimento.
[profile.dev.package.sha2]
opt-level = 3
